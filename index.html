
<!DOCTYPE html>

<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
  <style>
header {
background-color: #008080;
color: #FFFFFF;
text-align: center;
max-width: 800px;
margin: 0 auto;
padding: 16px;
border: 5px solid #191970;
}
main {
background-color: #000000;
color: #4FB4FF;
max-width: 800px;
margin: 0 auto;
padding: 16px;
  display: flex;
}
    img {
width: 120px;
height: 120px;
}
    .artigo-autor {
font-weight: bold;
}
  </style>
 
</head>
  <body>
    <header>
  <h1>Boas-vindas ao meu novo blog sobre a comunidade de Minecraft!</h1>
    <p>Vou compartilhar fatos sobre a comunidade de Minecraft.</p>
  </header>

  <main>
    <img src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExZDVwZno0ZWVqdG0zem1pNzU5Nml6MTh0djJxam5ibmF6bHJwcGk3dyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/6uqz4G16YT8u80b7aX/giphy.gif" alt="GIF Minecraft">
    
    <div>
      <h2>Meu primeiro post</h2>
      <p class="artigo-autor">Por: jonas</p>
      <p>Comunidade de Minecraft</p>
      
      <button>❤️ <span>0</span></button>
      <button>💩 <span>0</span></button>
    </div>
  </main>

  <script>
    const botoes = document.querySelectorAll("button");
    botoes.forEach(function(botao) {
      botao.addEventListener("click", botaoClicado);
      function botaoClicado() {
        console.log("Botão clicado!");
        let texto = botao.querySelector("span");
        if (texto) {
          texto.textContent++;
        }
      }
    });
  </script>
</body>
</html>
